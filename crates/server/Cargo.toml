[package]
name = "oxi-boot"
description = "PXE server that network-boots any ISO dropped into a folder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ar = "0.9.0"
async-tftp = "0.4.2"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
cpio = "0.4.2"
dhcproto = "0.15.0"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false }
http-range-header = "1.1.0"
if-addrs = "0.15.0"
liblzma = "0.4.9"
lz4_flex = "0.14.2"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["fs"] }
zstd = "0.14.5"

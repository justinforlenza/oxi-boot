[package]
name = "oxi-boot"
description = "PXE server that network-boots any ISO dropped into a folder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-tftp = "0.4.2"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
dhcproto = "0.15.0"
if-addrs = "0.15.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["fs"] }

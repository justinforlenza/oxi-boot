[package]
name = "oxi-boot-helper"
description = "Runs in a booted ISO's early-boot image and reattaches the ISO over the network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Ships inside every patched initrd as one static program: nothing beyond libc.
[dependencies]
fuser = { version = "0.19.0", default-features = false }
libc = "0.2"
